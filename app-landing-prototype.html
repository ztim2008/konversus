<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App-Like Landing Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* Colors */
            --bg-body: #f0f2f5;
            --bg-app: #ffffff;
            --primary: #2563eb;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --nav-height: 80px;
            
            /* Spacing */
            --gap: 1rem;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            /* On mobile, body background is white, on desktop it's gray to frame the app */
        }

        /* --- Main App Container --- */
        .app-shell {
            width: 100%;
            max-width: 1200px; /* The requested limit */
            background-color: var(--bg-app);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
            padding-bottom: calc(var(--nav-height) + 20px); /* Space for bottom nav */
            overflow-x: hidden;
        }

        /* --- Header --- */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem var(--gap);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-main);
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .icon-btn:hover { background: #f3f4f6; }

        /* --- Stories (Horizontal Scroll) --- */
        .stories-container {
            padding: 1rem 0;
            overflow-x: auto;
            display: flex;
            gap: 1rem;
            padding-left: var(--gap);
            padding-right: var(--gap);
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE */
        }
        .stories-container::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .story-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--bg-app);
            object-fit: cover;
        }

        .story-name {
            font-size: 0.75rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* --- Hero Section --- */
        .hero {
            padding: var(--gap);
        }

        .hero-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9; /* Responsive aspect ratio */
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .hero-card:hover .hero-bg { transform: scale(1.05); }

        .hero-content {
            position: relative;
            z-index: 10;
            padding: 2rem;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            width: 100%;
            color: white;
        }

        .hero-title {
            /* Fluid typography: scales between 1.5rem and 2.5rem based on viewport width */
            font-size: clamp(1.5rem, 4vw, 2.5rem); 
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        /* --- Grid Feed --- */
        .feed-grid {
            display: grid;
            /* Auto-fit columns: min 160px on mobile, expands on desktop */
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: var(--gap);
            padding: var(--gap);
        }

        /* On larger screens (simulating the "1200px expanded mobile" feel), 
           we might want bigger cards, so we adjust the minmax */
        @media (min-width: 768px) {
            .feed-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.5rem;
            }
        }

        .card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); }

        .card-img-wrapper {
            aspect-ratio: 4/5; /* Portrait aspect ratio like Pinterest/Instagram */
            width: 100%;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price {
            font-weight: 700;
            color: var(--primary);
        }

        .like-btn {
            background: #f3f4f6;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ef4444;
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            /* Center the nav relative to the window, but cap width at 1200px to match container */
            width: 100%;
            max-width: 1200px; 
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            /* Ensure it stays centered if body is wider */
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.2s;
            width: 60px;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item i {
            font-size: 1.5rem;
        }

        /* --- Floating Action Button (FAB) --- */
        .fab {
            position: fixed;
            bottom: calc(var(--nav-height) + 20px);
            right: calc(50% - 600px + 20px); /* Stick to right edge of 1200px container */
            width: 56px;
            height: 56px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            z-index: 90;
            transition: transform 0.2s;
        }
        
        /* Adjust FAB position for smaller screens */
        @media (max-width: 1240px) {
            .fab {
                right: 20px;
            }
        }

        .fab:hover { transform: scale(1.1); }

    </style>
</head>
<body>

    <div class="app-shell">
        
        <!-- Header -->
        <header class="app-header">
            <div class="logo">AppBuilder</div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="icon-btn"><i class="ph ph-bell"></i></button>
                <button class="icon-btn"><i class="ph ph-magnifying-glass"></i></button>
            </div>
        </header>

        <!-- Stories -->
        <section class="stories-container">
            <!-- Story 1 -->
            <div class="story-item">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="story-img" alt="User">
                </div>
                <span class="story-name">Your Story</span>
            </div>
            <!-- Story 2 -->
            <div class="story-item">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=100&q=80" class="story-img" alt="User">
                </div>
                <span class="story-name">Travel</span>
            </div>
            <!-- Story 3 -->
            <div class="story-item">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=100&q=80" class="story-img" alt="User">
                </div>
                <span class="story-name">Design</span>
            </div>
            <!-- Story 4 -->
            <div class="story-item">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=100&q=80" class="story-img" alt="User">
                </div>
                <span class="story-name">Lifestyle</span>
            </div>
            <!-- Story 5 -->
            <div class="story-item">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=100&q=80" class="story-img" alt="User">
                </div>
                <span class="story-name">Fashion</span>
            </div>
             <!-- Story 6 -->
             <div class="story-item">
                <div class="story-ring">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" class="story-img" alt="User">
                </div>
                <span class="story-name">Tech</span>
            </div>
        </section>

        <!-- Hero Banner -->
        <section class="hero">
            <div class="hero-card">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80" class="hero-bg" alt="Hero">
                <div class="hero-content">
                    <h1 class="hero-title">Explore the World</h1>
                    <p style="font-size: 1.1rem; opacity: 0.9;">Discover hidden gems and curated travel guides.</p>
                </div>
            </div>
        </section>

        <!-- Feed Grid -->
        <main class="feed-grid">
            <!-- Card 1 -->
            <article class="card">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80" class="card-img" alt="Post">
                </div>
                <div class="card-body">
                    <h3 class="card-title">Mountain Retreats: Top 10 Locations</h3>
                    <div class="card-meta">
                        <span class="price">Free</span>
                        <button class="like-btn"><i class="ph ph-heart-fill"></i></button>
                    </div>
                </div>
            </article>

            <!-- Card 2 -->
            <article class="card">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=600&q=80" class="card-img" alt="Post">
                </div>
                <div class="card-body">
                    <h3 class="card-title">Swiss Alps Guide 2025</h3>
                    <div class="card-meta">
                        <span class="price">$29.00</span>
                        <button class="like-btn"><i class="ph ph-heart"></i></button>
                    </div>
                </div>
            </article>

            <!-- Card 3 -->
            <article class="card">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=600&q=80" class="card-img" alt="Post">
                </div>
                <div class="card-body">
                    <h3 class="card-title">Culinary Journey: Italy</h3>
                    <div class="card-meta">
                        <span class="price">$45.00</span>
                        <button class="like-btn"><i class="ph ph-heart"></i></button>
                    </div>
                </div>
            </article>

            <!-- Card 4 -->
            <article class="card">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1481437156560-3205f6a55735?auto=format&fit=crop&w=600&q=80" class="card-img" alt="Post">
                </div>
                <div class="card-body">
                    <h3 class="card-title">Minimalist Shopping Guide</h3>
                    <div class="card-meta">
                        <span class="price">Free</span>
                        <button class="like-btn"><i class="ph ph-heart"></i></button>
                    </div>
                </div>
            </article>
        </main>

        <!-- Floating Action Button -->
        <div class="fab">
            <i class="ph ph-plus"></i>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="ph ph-house-fill"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <i class="ph ph-compass"></i>
                <span>Explore</span>
            </a>
            <a href="#" class="nav-item">
                <i class="ph ph-shopping-cart"></i>
                <span>Cart</span>
            </a>
            <a href="#" class="nav-item">
                <i class="ph ph-user"></i>
                <span>Profile</span>
            </a>
        </nav>

    </div>

</body>
</html>
